# .github/workflows/R-CMD-check.yaml
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

concurrency:
     group: ${{ github.workflow }}-${{ github.ref }}
     cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mdsumner/geospatial-r:r-gdalraster
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - name: Build and install MDAL
        run: |
          # the image ships an Arrow apt source whose signing key is missing
          rm -f /etc/apt/sources.list.d/*arrow*
          apt-get  update
          apt-get  upgrade -y
          apt-get  install -y cmake software-properties-common
          git clone --depth 1 https://github.com/lutraconsulting/MDAL.git /tmp/MDAL
          cd /tmp/MDAL
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          make install
          ldconfig

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("rcmdcheck", "cpp11", "testthat"), repos = "https://cloud.r-project.org")'

      - name: Check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning", check_dir = "check")'




