# .github/workflows/pkgdown.yaml
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mdsumner/geospatial-r:r-gdalraster

    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and install MDAL
        run: |
          git clone --depth 1 https://github.com/lutraconsulting/MDAL.git /tmp/MDAL
          cd /tmp/MDAL
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          make install
          ldconfig
          # Verify
          pkg-config --cflags --libs mdal || echo "pkg-config check"
          ls /usr/local/include/mdal.h

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("pkgdown", "cpp11"), repos = "https://cloud.r-project.org")'

      - name: Install package
        run: R CMD INSTALL .

      - name: Build site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
